name: proc-registry-eval

# All five nodes are identical apart from their hostname. The first three
# form the cluster; node4 and node5 boot idle and outside it, and a
# scenario adds them with the {join, ...} step.
x-node: &node
  build: .
  image: proc-registry-eval:latest
  # iptables needs NET_ADMIN to cut the network between the nodes, and
  # between a node and Postgres.
  cap_add: ["NET_ADMIN"]
  environment: &settings
    REGISTRY: ${REGISTRY:-global}
    PEERS: node1,node2,node3,node4,node5
    # Of the peers, the ones that are not in the cluster to begin with.
    JOINERS: node4,node5
    SETTLE_MS: ${SETTLE_MS:-15000}
    LEASE_MS: ${LEASE_MS:-60000}
    ACTION_TIMEOUT_MS: ${ACTION_TIMEOUT_MS:-20000}
    # Each phase of a locker write waits this long for the masters.
    LOCKER_TIMEOUT_MS: ${LOCKER_TIMEOUT_MS:-5000}
    # How often a HighlanderPG contender asks Postgres for the lock.
    HIGHLANDER_POLLING_MS: ${HIGHLANDER_POLLING_MS:-300}
    POSTGRES_HOST: postgres
    POSTGRES_PORT: 5432
    POSTGRES_USER: workbench
    POSTGRES_PASSWORD: workbench
    POSTGRES_DB: workbench
  command: ["node"]
  networks: ["cluster"]
  depends_on:
    postgres:
      condition: service_healthy

services:
  node1:
    <<: *node
    hostname: node1

  node2:
    <<: *node
    hostname: node2

  node3:
    <<: *node
    hostname: node3

  # Up, but outside the cluster until a scenario adds it.
  node4:
    <<: *node
    hostname: node4

  node5:
    <<: *node
    hostname: node5

  # Only highlander_pg uses it, but it is always up so that every run has
  # the same cluster around it.
  postgres:
    image: postgres:17-alpine
    hostname: postgres
    environment:
      POSTGRES_USER: workbench
      POSTGRES_PASSWORD: workbench
      POSTGRES_DB: workbench
    networks: ["cluster"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workbench"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Started with `docker compose run`, never with `up`: it drives the
  # scenarios and then exits.
  controller:
    build: .
    image: proc-registry-eval:latest
    hostname: controller
    environment: *settings
    command: ["scenarios"]
    networks: ["cluster"]
    volumes:
      - ./results:/app/results

networks:
  cluster:
    driver: bridge
